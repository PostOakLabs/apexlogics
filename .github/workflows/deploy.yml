name: Deploy to DreamHost

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Pre-flight checks (run before touching the server) ─────────────────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history (not shallow) — the sitemap lastmod gate below runs
          # `git log` per file and needs real commit dates, not the shallow
          # boundary commit (AL-SITEMAP-LASTMOD).
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── ChainGraph OCG v0.8 gate suite (blocking — B1) ──────────────────────
      # Zero-dependency node gates; no npm install needed. Each is proven to go
      # red on a broken fixture by gate-selftest.mjs (run last).
      - name: 🔗 CG gate — vendor freshness (_hash.mjs body + v0.4 schema vs SSOT pin)
        run: node scripts/check-vendor-fresh.mjs

      - name: 🔗 CG gate — schema validation (catalog + golden artifact fixtures)
        run: node chaingraph/standard/schema-validate.mjs

      - name: 🔗 CG gate — hash canon lint (forbidden preimage/hash idioms)
        run: node scripts/hash-lint.mjs

      - name: 🔗 CG gate — tool-level hash-freeze (golden hashes recompute vs SSOT canon)
        run: node scripts/hash-freeze.mjs

      - name: 🔗 CG gate — selftest (each gate must go red on a broken fixture)
        run: node scripts/gate-selftest.mjs

      - name: 🧪 JS syntax gate (CONTRACT §7.2 / CG-25 — blocking)
        run: node scripts/check_tools.js

      - name: 🔢 Count-drift gate (CONTRACT §7.2 / CG-32 — blocking)
        # index.html / tools.html carry hand-typed suite/showcase/workflow/guide
        # counts; this fails the build the moment any of them drift from
        # suite-registry.json + the live directory listings. Run with --fix
        # locally to self-heal.
        run: node scripts/verify-counts.mjs

      - name: 📋 Registry self-check gate (AL-REGSELF — blocking)
        # suite-registry.json's own scalar fields (showcase_count, version vs
        # registry_version, per-entry url/file_path) are unguarded by
        # verify-counts.mjs, which only checks .well-known/mcp.json. Fails the
        # build if the registry disagrees with its own tools[] array or with
        # disk. No baseline, no exception list.
        run: node scripts/check-registry-self.mjs

      - name: 🔒 Zero-storage gate (CONTRACT §0/§7.2 / CG-35 — blocking)
        # Fails the build on any localStorage/sessionStorage/document.cookie/
        # indexedDB usage across tool, showcase, chaingraph, workflow, guide,
        # and root HTML. Zero tolerance — no baseline, no exception list
        # (AL-I18N-RECORD). Root-caused by 85 tools carrying a live sessionStorage
        # write for ~a year with no gate to catch it (AL-I18N-NEUTRALIZE, PR #36).
        run: node scripts/check-no-storage.mjs

      - name: 🔗 Dead-link gate (AL-LINKGATE — blocking)
        # Fails the build on any href/src across tool, showcase, chaingraph,
        # workflow, guide, and root HTML that resolves to a missing target.
        # No baseline, no exception list.
        run: node scripts/check-links.mjs

      - name: 🏷️ Brand/title gate (AL-BRAND-TITLES — blocking)
        # Fails the build if any tool/showcase <title> uses the spaced "Apex Logics"
        # token or a non-canonical separator (only "·" allowed), or if any tool
        # index.html lacks an "apexlogics.org" attribution string on the page.
        # No baseline, no exception list — commit f849374 fixed this drift in 2
        # tools without sweeping the class, and it came back.
        run: node scripts/check-brand-titles.mjs

      - name: 🔎 SEO metadata gate (AL-META-SEO, CG-39 — blocking)
        # Fails the build if any HTML page lacks <title>, meta description,
        # canonical link, the full OG set, or twitter:card. No baseline, no
        # exception list. Root-caused by 343/352 pages shipping zero OG tags
        # for over a year with nothing to catch it.
        run: node scripts/check-seo-meta.mjs

      - name: 🔗 ChainGraph parity — site vs worker copy (AL-CHAINGRAPH-SYNC)
        # Two chaingraph.json copies exist (site canonical, worker ported by
        # hand) — compares chain step tool_id sequences against the worker
        # repo's live raw file so the two can't silently re-split again.
        # Skips (non-blocking) if the worker repo can't be fetched.
        run: node scripts/check-chaingraph-parity.mjs

      - name: 🗺️ Sitemap lastmod gate (AL-SITEMAP-LASTMOD — blocking)
        # Fails the build if sitemap.xml's <lastmod> values don't match each
        # URL's mapped file's real last-commit date. No baseline, no exception
        # list. Run with --fix locally to self-heal. Needs full git history
        # (see fetch-depth: 0 above) — a shallow clone would silently produce
        # wrong dates rather than failing loudly, so the script itself checks
        # for .git/shallow and errors out instead of trusting bad input.
        run: node scripts/gen-sitemap.mjs

      - name: 🔍 Index sync — verify all tools are in the catalog
        # Fails the build if any tool subdir in tools/ has no card in tools.html
        # (AL-HOMESPLIT, CG-32 — retargeted from index.html, now a curated
        # landing page that intentionally shows a subset).
        # To suppress a false positive: add the slug to INTENTIONAL_OMISSIONS
        # in scripts/check_index_sync.py and commit that change.
        run: python scripts/check_index_sync.py --strict --no-color

      - name: 📋 Tool count summary
        run: |
          TOOL_COUNT=$(find tools -maxdepth 2 -name "index.html" | wc -l)
          echo "🔢 Tools: $TOOL_COUNT"

      - name: 🔒 Line-ending guard — confirm no CRLF in committed HTML/JSON
        # Catches accidental CRLF commits that cause phantom diffs on re-push.
        # .gitattributes enforces LF, but this step gives a visible CI signal
        # if a file slips through (e.g. committed before .gitattributes existed).
        run: |
          BAD=$(git ls-files '*.html' '*.json' '*.yml' '*.js' '*.css' \
                | xargs grep -rlP '\r' 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "⚠️  CRLF line endings detected in:"
            echo "$BAD"
            echo ""
            echo "Run: git add --renormalize . && git commit -m 'chore: normalise line endings'"
            echo "(This is a warning — deploy will still proceed)"
          else
            echo "✅ All text files use LF line endings"
          fi

  # ── Deploy (only runs if preflight passes) ─────────────────────────────────
  deploy:
    name: Deploy to DreamHost
    runs-on: ubuntu-latest
    needs: preflight
    # Gates run on pull_request (CI signal before merge); the server deploy
    # only fires on a real push to main. A PR never touches DreamHost.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Setup SSH Key & Host
        # AL-DEPLOY-HARDEN (P2-7): host-key pinning is opt-in via the
        # DH_HOST_KEY secret (paste the output of
        # `ssh-keyscan -H <DH_SSH_HOST>` run from a trusted machine).
        # Until Tim provisions it, this falls back to trust-on-first-use
        # (StrictHostKeyChecking=no) exactly as before — MITM-exposed but
        # not a regression. Once the secret exists, verification flips to
        # strict automatically, no code change needed.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DH_SSH_KEY }}
          DH_HOST_KEY: ${{ secrets.DH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Write key via env var (preserves newlines reliably)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$DH_HOST_KEY" ]; then
            printf '%s\n' "$DH_HOST_KEY" >> ~/.ssh/known_hosts
            echo "STRICT_HOST_KEY_CHECKING=yes" >> "$GITHUB_ENV"
            echo "🔒 DH_HOST_KEY present — StrictHostKeyChecking=yes"
          else
            ssh-keyscan -H ${{ secrets.DH_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
            echo "STRICT_HOST_KEY_CHECKING=no" >> "$GITHUB_ENV"
            echo "::warning::DH_HOST_KEY secret not set — using trust-on-first-use (no MITM protection). See AL-DEPLOY-HARDEN for the value to paste."
          fi

          # Verification (safe — does not expose key content)
          echo "Key header : $(head -1 ~/.ssh/deploy_key)"
          echo "Key footer : $(tail -1 ~/.ssh/deploy_key)"
          echo "Permissions: $(stat -c %a ~/.ssh/deploy_key)"
          echo "Key size   : $(wc -c < ~/.ssh/deploy_key) bytes"

      - name: 🔌 Test SSH connection to DreamHost
        # Retries 3× with 15s delay — DreamHost shared SSH is occasionally
        # briefly unreachable (connection timeout). Hard-fails only if all
        # attempts exhaust, preventing rsync --delete against a bad target.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/deploy_key \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=$STRICT_HOST_KEY_CHECKING \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                ${{ secrets.DH_SSH_USER }}@${{ secrets.DH_SSH_HOST }} "echo '✅ SSH connection confirmed'"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::SSH connection failed after 3 attempts"
              exit 1
            fi
            echo "SSH attempt $attempt failed — retrying in 15s..."
            sleep 15
          done

      - name: 🔍 Dry-run rsync (shows what will change — no writes)
        run: |
          set -euo pipefail
          rsync -avz --delete --dry-run --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=$STRICT_HOST_KEY_CHECKING -o ConnectTimeout=15" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='CLAUDE.md' \
            --exclude='.env*' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            ./ ${{ secrets.DH_SSH_USER }}@${{ secrets.DH_SSH_HOST }}:${{ secrets.DH_WEB_ROOT }}/

      - name: 🚀 Sync to DreamHost via rsync
        run: |
          set -euo pipefail
          rsync -avz --delete --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=$STRICT_HOST_KEY_CHECKING -o ConnectTimeout=15" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='CLAUDE.md' \
            --exclude='.env*' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            ./ ${{ secrets.DH_SSH_USER }}@${{ secrets.DH_SSH_HOST }}:${{ secrets.DH_WEB_ROOT }}/

          echo "✅ rsync completed successfully."

      - name: 🧹 Purge Cloudflare edge cache (AL-CDNPURGE)
        # Without this, CF serves stale edge copies for up to Cache-Control
        # max-age (4h) after every deploy — real users see old pages, and a
        # cached HIT can also mask a broken deploy behind old-but-fine content.
        # Requires CF_API_TOKEN + CF_ZONE_ID repo secrets (not yet provisioned
        # as of 2026-08-22 — flagged to Tim, AL-CDNPURGE). Skips gracefully
        # (non-blocking) until they exist so this lands without a red gate.
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::CF_API_TOKEN/CF_ZONE_ID not set — edge cache NOT purged. Real users may see stale pages until Cache-Control max-age expires (AL-CDNPURGE, needs Cloudflare API token from Tim)."
            exit 0
          fi
          RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true' || { echo "::error::Cloudflare purge failed: $RESP"; exit 1; }
          echo "✅ Cloudflare edge cache purged."

      - name: 🌐 Smoke test — homepage responds
        # Blocking the moment DH_SITE_URL exists (AL-DEPLOY-HARDEN, ORCH
        # correction 2026-08-29 confirmed the secret IS set). Follows
        # redirects (-L) and requires the FINAL response to be 200 — a bare
        # 301/302 used to pass even when it pointed at a parked/error page.
        # Set DH_SITE_URL secret to your domain: https://apexlogics.org
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DH_SITE_URL }}" ]; then
            echo "ℹ️  DH_SITE_URL secret not set — skipping smoke test"
            echo "   Add it in GitHub → Settings → Secrets → Actions"
            exit 0
          fi
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
            --max-time 15 "${{ secrets.DH_SITE_URL }}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site responded with HTTP $HTTP_CODE (following redirects)"
          else
            echo "❌ Site returned final HTTP $HTTP_CODE after redirects — deploy may have failed"
            exit 1
          fi

      - name: 📊 Deploy summary
        run: |
          TOOL_COUNT=$(find tools -maxdepth 2 -name "index.html" | wc -l)
          echo "## Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------:|" >> $GITHUB_STEP_SUMMARY
          echo "| Tools deployed | $TOOL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
